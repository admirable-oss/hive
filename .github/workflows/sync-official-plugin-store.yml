name: Sync official plugins to the Hive website

on:
  push:
    branches: [main]
    paths:
      - "registry/official-releases.json"
      - "registry/official-listings.json"
      - "registry/revocations.json"
      - "registry/official-signatures.json"
      - "registry/publishers.json"
      - "registry/compat-results.json"
      - "registry/submissions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-plugin-store
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: hive
      - name: Create cross-repository pull request token
        id: pullive-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULLIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULLIVE_APP_PRIVATE_KEY }}
          owner: admirable-oss
          repositories: hive,hive-web
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          repository: admirable-oss/hive-web
          token: ${{ steps.pullive-token.outputs.token }}
          path: hive-web
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
      # The script reads and rewrites the website's registry copies by
      # their paths in hive-web, so it runs from that checkout.
      - name: Seed official plugin releases into the website registry
        working-directory: hive-web
        run: node .github/scripts/seed-official-registry.mjs ../hive
      # Revocations are served beside the catalog (hive 1.0.10 and later
      # read them; docs/plugins/ecosystem.md).
      - name: Copy the registry's revocations
        run: cp hive/registry/revocations.json hive-web/public/plugins/revocations.json
      # Schema 2 (Hive 1.7 and later read it first): built and checked as
      # Hive reads it, and published only once every official and verified
      # release is signed. Until then nothing is written and Hive keeps
      # reading registry.json.
      - uses: actions/setup-go@v7
        with:
          go-version-file: hive/go.mod
      - name: Build the schema 2 catalog
        working-directory: hive
        run: go run ./tools/plugin-registry build --dir registry -o ../hive-web/public/plugins/registry-2.json --if-ready
      - name: Create a registry update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.pullive-token.outputs.token }}
          path: hive-web
          branch: automation/sync-official-plugin-registry
          base: main
          delete-branch: true
          add-paths: |
            public/plugins/registry.json
            public/plugins/revocations.json
            public/plugins/registry-2.json
            src/data/plugins-registry.json
          commit-message: "chore(plugins): sync official plugin releases"
          title: "chore(plugins): sync official plugin releases"
          body: "Generated from hive/registry/official-releases.json, official-listings.json and revocations.json."
