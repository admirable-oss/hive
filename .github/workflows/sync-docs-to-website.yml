name: Sync docs to the Hive website

# Regenerates the website's pages for the repository docs (the list is in
# hive-web/.github/scripts/sync-hive-docs.mjs), the roadmap snapshot and
# the plugin revocations, and opens a pull request on hive-web.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "rfcs/**"
      - "SECURITY.md"
      - "GOVERNANCE.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "registry/revocations.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs-to-website
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hive
      - name: Create cross-repository pull request token
        id: pullive-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULLIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULLIVE_APP_PRIVATE_KEY }}
          owner: admirable-oss
          repositories: hive,hive-web
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          repository: admirable-oss/hive-web
          token: ${{ steps.pullive-token.outputs.token }}
          path: hive-web
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Generate the website's docs pages
        run: node hive-web/.github/scripts/sync-hive-docs.mjs hive
      - name: Create a docs update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.pullive-token.outputs.token }}
          path: hive-web
          branch: automation/sync-hive-docs
          base: main
          delete-branch: true
          add-paths: |
            src/content/docs/docs
            src/data/ROADMAP.md
            public/plugins/revocations.json
          commit-message: "docs: sync from admirable-oss/hive"
          title: "docs: sync from admirable-oss/hive"
          body: "Generated by hive's sync-docs-to-website workflow from ${{ github.sha }}. Pages marked as generated are edited in admirable-oss/hive."
