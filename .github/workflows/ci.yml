name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: lint the Windows build
        run: GOOS=windows golangci-lint run ./...

  # Known vulnerabilities in the code's call graph: the standard library of
  # the toolchain go.mod names, and every module. Nightly runs it too, since
  # new advisories arrive without a change here.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test (race, goleak)
        # Both runner images ship Chrome: the web observer's browser tests
        # must run, not skip.
        env:
          HIVE_BROWSER_TESTS: require
        run: go test -race -count=1 -timeout 10m -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: build
        run: make build && ./hive version

  # Windows (amd64 and arm64): the platform layer (ConPTY, job objects,
  # AF_UNIX sockets, file locks) and the runtime. Unix-only tests carry
  # //go:build !windows; Windows has its own (*_windows_test.go).
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      # Windows PowerShell's first start on a fresh runner (.NET and module
      # loading) has taken over 90 s, which the ConPTY tests then time. Pay
      # for it here, outside any test.
      - name: warm up Windows PowerShell
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -Command "Write-Output warm"
      - name: test
        run: go test -count=1 -timeout 20m ./...
      - name: build
        shell: pwsh
        run: |
          go build -trimpath -o hive.exe ./cmd/hive
          ./hive.exe version

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=45s

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: build the flake
        run: nix build .#hive --print-build-logs && ./result/bin/hive version

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: name the snapshot after the last hive release
        run: echo "GORELEASER_CURRENT_TAG=$(git describe --abbrev=0 2>/dev/null || echo v0.0.0)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign,sbom
      - uses: actions/upload-artifact@v7
        with:
          name: hive-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # The same commit builds the same bytes: two builds from copies made at
  # different times must produce identical archives (M20).
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          install-only: true
      - name: build twice and compare
        run: sh .github/scripts/reproducible.sh
