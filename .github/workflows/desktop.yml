name: desktop

# The desktop app (desktop/, M18) is its own Go module: it needs cgo and the
# platform webviews (Wails), which the CLI does not, so it builds here on
# native runners and leaves ci.yml, goreleaser and the Nix flake alone.

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - pkg/**
      - internal/**
      - cmd/hive/**
      - go.mod
      - go.sum
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - pkg/**
      - internal/**
      - cmd/hive/**
      - go.mod
      - go.sum
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      package:
        description: Build installable packages as a release would (unsigned)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-beta.32
  # The webviews' build dependencies on Linux (GTK4, WebKitGTK 6.0).
  LINUX_DEPS: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - name: audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: install the webview's build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 . ./internal/...
      - name: build the frontend
        working-directory: desktop/frontend
        run: npm ci && npm run build
      - name: bindings are up to date
        if: runner.os == 'macOS'
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          wails3 generate bindings -f '-tags production -trimpath -buildvcs=false -ldflags="-w -s"' -clean=true -ts
          git diff --exit-code -- frontend/bindings
          test -z "$(git status --porcelain -- frontend/bindings)" || { git status --porcelain -- frontend/bindings; echo "::error::regenerate the bindings (wails3 task common:generate:bindings)"; exit 1; }
      - name: build hive for the tests
        working-directory: .
        run: go build -o "$RUNNER_TEMP/hive$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/hive
      - name: vet
        run: go vet . ./internal/...
      - name: test
        env:
          HIVE_BIN: ${{ runner.temp }}/hive${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go test -count=1 -timeout 10m ./internal/...
          else
            go test -race -count=1 -timeout 10m ./internal/...
          fi
      # M18's idle budget (1 % of a core, 64 MB of heap, 16 panes) is
      # measured without the race detector, which would distort it.
      - name: idle budget
        if: runner.os != 'Windows'
        env:
          HIVE_BIN: ${{ runner.temp }}/hive
        run: go test -count=1 -timeout 5m -run TestIdleBudgetWith16Panes -v ./internal/core/
      # It also measures keystroke-to-screen latency against M18's budget.
      - name: end-to-end (server build, headless Chrome)
        if: runner.os != 'Windows'
        env:
          HIVE_DESKTOP_E2E: require
          # M18's latency budget is 25 ms (p99) on a developer machine; on
          # shared runners the test holds it to 50 ms, two frames past it.
          HIVE_DESKTOP_LATENCY_MS: "50"
        run: go test -count=1 -timeout 10m -run TestDesktopEndToEnd .
      - name: build the app
        run: go build -tags production -o "$RUNNER_TEMP/hive-desktop$([ "$RUNNER_OS" = Windows ] && echo .exe)" .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: install the webview's build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: desktop
          # Packages by name: frontend/node_modules holds Go files too.
          args: . ./internal/...
      - name: lint the Windows build
        working-directory: desktop
        run: GOOS=windows golangci-lint run . ./internal/...

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: [frontend, go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: install the webview's build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
      - name: install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || { choco install nsis -y --no-progress && echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"; }
      - name: build the hive CLI to bundle
        working-directory: .
        run: |
          build() { CGO_ENABLED=0 GOARCH=$1 go build -trimpath -ldflags "-s -w -X github.com/admirable-oss/hive/internal/buildinfo.version=$(git describe --always)" -o "$2" ./cmd/hive; }
          case "$RUNNER_OS" in
          macOS)
            build arm64 "$RUNNER_TEMP/hive-arm64" && build amd64 "$RUNNER_TEMP/hive-amd64"
            lipo -create -output "$RUNNER_TEMP/hive" "$RUNNER_TEMP/hive-arm64" "$RUNNER_TEMP/hive-amd64"
            echo "HIVE_CLI=$RUNNER_TEMP/hive" >> "$GITHUB_ENV" ;;
          Windows)
            build amd64 "$RUNNER_TEMP/hive.exe"
            echo "HIVE_CLI=$RUNNER_TEMP/hive.exe" >> "$GITHUB_ENV" ;;
          esac
      # The release path (build/release.sh), without code signing: what a tag
      # would publish, under the same names.
      - name: package
        env:
          HIVE_DESKTOP_UNSIGNED: "1"
          OUT: ${{ runner.temp }}/desktop
        run: build/release.sh "v0.0.0-preview.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hive-desktop-${{ runner.os }}
          path: ${{ runner.temp }}/desktop/*
          if-no-files-found: error
          retention-days: 14
