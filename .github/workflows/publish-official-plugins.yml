name: Publish official plugin releases

on:
  push:
    branches: [main]
    paths:
      - "plugins/official/**"
      - ".github/scripts/publish-official-plugins.sh"
      - ".github/workflows/publish-official-plugins.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/plugin-submissions.yml"
      - "registry/publishers.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-official-plugins
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate the official plugin manifests
        run: |
          for dir in plugins/official/*/; do
            go run ./cmd/hive plugin validate "$dir"
          done
      - name: Tag releases and record archive checksums
        run: .github/scripts/publish-official-plugins.sh
      # Schema 2: the official publisher signs each release once
      # (registry/official-signatures.json). Without the key the releases
      # stay unsigned, and the store keeps serving schema 1 alone.
      - name: Sign the official releases
        env:
          HIVE_PLUGIN_SIGNING_KEY: ${{ secrets.HIVE_PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$HIVE_PLUGIN_SIGNING_KEY" ]; then
            echo "::warning::HIVE_PLUGIN_SIGNING_KEY is not set: official releases stay unsigned and registry-2.json is not published (docs/plugins/ecosystem.md)"
            exit 0
          fi
          go run ./tools/plugin-registry sign
      - name: Create Pullive installation token
        id: pullive-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULLIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULLIVE_APP_PRIVATE_KEY }}
          owner: admirable-oss
          repositories: hive,hive-web
          permission-contents: write
          permission-pull-requests: write
      - name: Open a pull request for the release records
        id: release-records-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.pullive-token.outputs.token }}
          add-paths: |
            registry/official-releases.json
            registry/official-signatures.json
          branch: automation/official-plugin-release-records
          base: main
          delete-branch: true
          commit-message: "chore(plugin): record official plugin release metadata"
          title: "chore(plugin): record official plugin release metadata"
          body: |
            This pull request records the immutable official plugin tags,
            pinned commits, and full-repository archive checksums published by
            the official plugin release workflow. CI and plugin-submission
            checks run automatically from the pull request event.
