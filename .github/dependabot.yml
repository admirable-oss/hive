# Dependency updates, reviewed like any change: CI (with govulncheck) runs on
# each pull request. Security updates are opened as soon as an advisory
# appears; version updates come weekly and are grouped to keep the noise
# down. A new dependency still needs an ADR (CONTRIBUTING.md); an update
# does not.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      # go-runewidth 0.0.26 builds a 2 MB width table in init(), which made
      # every hive command start about 13 ms slower (7 ms to 20 ms), and x/ansi
      # 0.11.9 requires it. Lift this once runewidth builds the table lazily.
      - dependency-name: github.com/mattn/go-runewidth
        versions: [">= 0.0.26"]
      - dependency-name: github.com/charmbracelet/x/ansi
        versions: [">= 0.11.9"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-go:
        patterns: ["*"]
    ignore:
      # Pinned to an exact beta on purpose (docs/desktop.md); moved by hand.
      - dependency-name: github.com/wailsapp/wails/v3
      # As for the root module: runewidth's init() cost (see above).
      - dependency-name: github.com/mattn/go-runewidth
        versions: [">= 0.0.26"]
      - dependency-name: github.com/charmbracelet/x/ansi
        versions: [">= 0.11.9"]
    commit-message:
      prefix: "chore(deps,desktop)"

  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: weekly
    groups:
      desktop-npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (8.72.0); a newer
      # TypeScript cannot be installed beside it. Lift this when it does.
      - dependency-name: typescript
        versions: [">= 6.1.0"]
    commit-message:
      prefix: "chore(deps,desktop)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
