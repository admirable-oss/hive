api = 1
id = "hive-explorer"
name = "Hive Explorer"
version = "0.2.0"
description = "Browse, preview, search, and inspect Git status in the current workspace."
min_hive_version = "1.0.2"

[permissions]
# The explorer itself runs in a popup pane Hive starts; the plugin only
# opens it.
required = ["hive.write"]
[permissions.reasons]
"hive.write" = "open the explorer in a popup over the current tab"

[[runtime]]
command = "node"
min_version = "20.0.0"

[[actions]]
id = "open"
title = "Open Hive Explorer"
command = ["node", "dist/index.mjs"]
timeout = "15s"

[[contributes.actions]]
action = "open"
contexts = ["pane", "environment"]

[[contributes.palette]]
action = "open"
