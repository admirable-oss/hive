# Shows each environment's pull request (state and checks) beside it in
# the sidebar, on a card, and how many are open on the tab bar. Needs the
# GitHub CLI (gh), signed in.
api = 1
id = "pr-status"
name = "PR status"
version = "0.2.0"
description = "Shows each environment's pull request and its checks in the sidebar (needs gh)."
min_hive_version = "1.0.2"
platforms = ["darwin", "linux"]

[permissions]
required = ["hive.read", "hive.write", "process.exec", "network"]
[permissions.reasons]
"hive.read" = "list environments and their directories"
"hive.write" = "put the PR on each environment's sidebar token and card"
"process.exec" = "run git and gh"
network = "gh asks GitHub about pull requests"

[[startup]]
command = ["./pr-status.sh", "watch"]
restart = true

[[actions]]
id = "refresh"
title = "Refresh pull requests now"
command = ["./pr-status.sh", "once"]

[[actions]]
id = "open"
title = "Open this environment's PR"
command = ["./pr-status.sh", "open"]

[[contributes.cards]]
id = "pr"
title = "Pull request"
scope = "environment"

[[contributes.status]]
id = "open-prs"
title = "Open pull requests"

[[contributes.actions]]
action = "open"
contexts = ["environment", "pane", "agent"]

[[contributes.palette]]
action = "refresh"

[[contributes.links]]
id = "pulls"
title = "Your pull requests on GitHub"
url = "https://github.com/pulls"
