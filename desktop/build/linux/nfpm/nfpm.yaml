# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "hive-desktop"
arch: ${GOARCH}
platform: "linux"
# The release script sets HIVE_DESKTOP_VERSION (build/release.sh).
version: "${HIVE_DESKTOP_VERSION}"
section: "default"
priority: "extra"
maintainer: "Admirable OSS <https://github.com/admirable-oss/hive>"
description: "Coding agents that keep working when you close the window"
vendor: "Admirable OSS"
homepage: "https://hive.admir-saheta.com"
license: "MIT"
release: "1"

contents:
  - src: "./bin/hive-desktop"
    dst: "/usr/local/bin/hive-desktop"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/hive-desktop.png"
  - src: "./build/linux/hive-desktop.desktop"
    dst: "/usr/share/applications/hive-desktop.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# Release packages are signed with the project's PGP key; an empty
# NFPM_SIGNING_KEY_FILE (a local build) leaves them unsigned. NFPM_PASSPHRASE
# unlocks the key.
deb:
  signature:
    key_file: "${NFPM_SIGNING_KEY_FILE}"
rpm:
  signature:
    key_file: "${NFPM_SIGNING_KEY_FILE}"

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
