[package]
name = "hive-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Official Rust SDK for Hive plugins and daemon protocol 2"
license = "Apache-2.0"
repository = "https://github.com/hive-oss/plugin-sdk"
readme = "README.md"
keywords = ["hive", "plugins", "sdk", "terminal"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
