# Release builds. `make snapshot` builds them locally; CI builds a snapshot
# on every push. Nothing here publishes until a release workflow is added.
version: 2
project_name: hive

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: hive
    main: ./cmd/hive
    binary: hive
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/admirable-oss/hive/internal/buildinfo.version={{ .Version }}
      - -X github.com/admirable-oss/hive/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/admirable-oss/hive/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
