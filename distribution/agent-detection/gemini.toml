id = "gemini"
name = "Gemini CLI"
# The rules were written from Gemini CLI's documentation and screenshots,
# not recorded from it.
synthetic = true

[detect]
process = ["gemini"]

[start]
command = ["gemini"]

[[rules]]
state = "blocked"
priority = 20
description = "a tool confirmation"
[rules.match]
any = [
  { line_regex = "Allow execution of: .*\\?" },
  { line_regex = "Apply this change\\?" },
  { line_regex = "Do you want to proceed\\?" },
  { contains = "No, suggest changes (esc)" },
]

[[rules]]
state = "working"
priority = 10
description = "the spinner says esc to cancel"
[rules.match]
line_regex = '\(esc to cancel, \d+'
